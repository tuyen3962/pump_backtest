# Nginx reverse proxy example for the dashboard.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/pump-backtest
#          sudo ln -s /etc/nginx/sites-available/pump-backtest /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace DOMAIN and enable certbot when ready:
#   sudo certbot --nginx -d backtest.example.com

upstream pump_dashboard {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    client_max_body_size 2m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://pump_dashboard;
    }
}
